<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Lector de ventas: opciones</title>
<style>
  body { font: 15px/1.5 system-ui, sans-serif; max-width: 560px; margin: 32px auto; padding: 0 16px; color: #1d1d1f; }
  h1 { font-size: 20px; }
  label { display: block; margin-top: 18px; font-weight: 600; }
  small { display: block; color: #6e6e73; font-weight: 400; }
  input { width: 100%; box-sizing: border-box; padding: 8px 10px; margin-top: 6px; font: inherit; border: 1px solid #c7c7cc; border-radius: 8px; }
  .fila { display: flex; gap: 12px; }
  button { margin-top: 24px; padding: 10px 18px; font: inherit; font-weight: 600; border: 0; border-radius: 8px; background: #1d1d1f; color: #fff; cursor: pointer; }
  #estado { margin-top: 14px; }
  .mal { color: #b4402e; }
</style>
</head>
<body>
<h1>Lector de ventas</h1>
<p>La extensión lee tus anuncios y tus ventas con la sesión que tengas abierta en Vinted y Wallapop, y los manda a tu panel. Instrucciones en el README del proyecto.</p>
<form id="f">
  <label>Dirección del panel
    <small>La de tu proyecto de Vercel, por ejemplo https://mis-ventas.vercel.app</small>
    <input name="panel" type="url" required placeholder="https://mis-ventas.vercel.app">
  </label>
  <label>Clave del lector
    <small>La variable CLAVE_LECTOR que pusiste en Vercel.</small>
    <input name="clave" type="password" required autocomplete="off">
  </label>
  <label>Tu número de Vinted
    <small>Abre tu perfil en Vinted: es el número de la dirección (vinted.es/member/<b>123456789</b>).</small>
    <input name="vinted" inputmode="numeric" pattern="\d+" required>
  </label>
  <label>Tu ubicación (opcional)
    <small>Para saber en qué puesto salen tus anuncios cuando alguien de tu zona busca en Wallapop. En Google Maps, clic derecho en tu pueblo: los dos primeros números.</small>
  </label>
  <div class="fila">
    <input name="lat" inputmode="decimal" placeholder="Latitud (38.51)">
    <input name="lon" inputmode="decimal" placeholder="Longitud (-1.70)">
  </div>
  <button>Guardar</button>
  <div id="estado"></div>
</form>
<script src="opciones.js"></script>
</body>
</html>
